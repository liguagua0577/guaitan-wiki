<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>怪谈世界 · 百科</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar" role="navigation" aria-label="主导航">
    <div class="brand">
      <span class="brand-mark">怪谈</span>
      <span class="brand-sub">GT&nbsp;LIBRARY</span>
    </div>
    <nav class="nav">
      <a href="#/" class="nav-item" data-route="home">
        <span class="nav-idx">00</span>首页
      </a>
      <a href="#/library" class="nav-item" data-route="library">
        <span class="nav-idx">01</span>怪谈图书馆
      </a>
      <a href="#/world" class="nav-item" data-route="world">
        <span class="nav-idx">02</span>了解世界观
      </a>
      <a href="#/edit" class="nav-item nav-item--edit" data-route="edit" id="navEdit" aria-disabled="true">
        <span class="nav-idx">03</span>编辑词条
        <span class="nav-lock" aria-hidden="true"><svg viewBox="0 0 16 16" width="11" height="11"><rect x="3.5" y="6.6" width="9" height="6.4" fill="currentColor"/><path d="M5.5 6.6V4.9a2.5 2.5 0 0 1 5 0v1.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <span class="edit-mode-wrap">
        <button id="editToggle" class="edit-toggle" type="button" aria-expanded="false">
          <span class="edit-toggle-dot" aria-hidden="true"></span>
          <span id="editToggleTxt">开启编辑模式</span>
        </button>
        <span id="editKeyRow" class="edit-keyrow" hidden>
          <input id="editKeyInput" type="password" inputmode="numeric" maxlength="8" placeholder="输入密钥" autocomplete="off">
          <button id="editKeyGo" type="button">进入</button>
        </span>
      </span>
      <span class="sidebar-hint">词条数载入中</span>
    </div>
  </aside>

  <main id="main" role="main">
    <div id="view" class="view" aria-live="polite"></div>
  </main>

</div>

<div id="tooltip" class="tooltip" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
